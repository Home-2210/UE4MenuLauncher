
name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project UE4MenuLauncher.xcodeproj \
            -scheme UE4MenuLauncher \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/UE4MenuLauncher.app Payload/
          /usr/bin/zip -r UE4MenuLauncher-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UE4MenuLauncher-unsigned-IPA
          path: UE4MenuLauncher-unsigned.ipa
          retention-days: 7
